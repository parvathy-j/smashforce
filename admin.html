<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smashforce Admin Panel</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpeg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
  </head>
  <body>
    <main class="admin-wrap">
      <header class="admin-head">
        <div>
          <p class="eyebrow">Smashforce Badminton Centre</p>
          <h1>Admin Dashboard</h1>
        </div>
        <div class="quick-links">
          <span id="adminSessionLabel">Checking session…</span>
          <button id="adminLogoutBtn">Logout</button>
          <a href="booking.html" target="_blank">Bookings</a>
          <a href="receptionist.html" target="_blank">Reception</a>
        </div>
      </header>

      <!-- CALENDAR -->
      <section class="card">
        <h2>Calendar</h2>
        <div id="adminFullCalendar"></div>
      </section>

      <!-- BOOKINGS -->
      <section class="card">
        <div class="section-head">
          <h2>Recent Bookings</h2>
          <div>
            <button id="refreshBookingsBtn" class="btn">Refresh</button>
            <button id="reconcileBookingsBtn" class="btn">Reconcile</button>
          </div>
        </div>

        <!-- FILTERS -->
        <div class="filters">
          <input id="bookingsDateFilter" type="date" />
          <select id="bookingsStatusFilter">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="pending_in_person">Pending In Person</option>
            <option value="paid">Paid</option>
            <option value="expired">Expired</option>
            <option value="failed">Failed</option>
          </select>
          <input id="bookingsEmailFilter" placeholder="Search email" />
          <input id="bookingsRefFilter" placeholder="Search reference" />
          <button id="bookingsRefSearchBtn" class="btn">Search</button>
        </div>

        <!-- SUMMARY -->
        <div id="bookedSummary" class="summary-box">
          <strong>Booked Courts:</strong>
          <div id="bookedSummaryContent">Select a date to see booked courts/tables.</div>
        </div>

        <!-- TABLE -->
        <div class="table-container">
          <table class="bookings-table">
            <thead>
              <tr>
                <th>Created</th>
                <th>Ref</th>
                <th>Customer</th>
                <th>Facility</th>
                <th>Date</th>
                <th>Time</th>
                <th>Amount</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody">
              <tr><td colspan="9">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- MEMBERSHIP -->
      <section class="card">
        <h2>Membership Lookup</h2>
        <form id="membershipLookupForm" class="inline-form">
          <input id="membershipLookupEmail" type="email" placeholder="Enter email" required />
          <button class="btn">Check</button>
        </form>
        <div id="membershipLookupResult"></div>
      </section>

      <div id="statusBar" class="status-bar"></div>
    </main>

    <!-- Booking Details Modal -->
    <div id="bookingDetailsModal" class="modal">
      <div class="modal-content">
        <span class="close" id="closeBookingDetails">&times;</span>
        <h3>Bookings for <span id="modalDateLabel"></span></h3>
        <div id="modalBookingList"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
