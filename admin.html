<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smash Force Admin Panel</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-wrap">
      <header class="admin-head">
        <div>
          <p class="eyebrow">Smash Force Academy</p>
          <h1>Website Admin Panel</h1>
          <p class="sub"></p>
        </div>
        <div class="quick-links">
          <span id="adminSessionLabel">Checking session…</span>
          <button id="adminLogoutBtn" type="button">Logout</button>
          <a href="smash-force-academy.html" target="_blank">Open Website</a>
          <a href="booking.html" target="_blank">Open Booking</a>
        </div>
      </header>

      <form id="adminForm" class="admin-grid">
        <section class="card">
          <h2>Branding</h2>
          <label>Logo Tagline</label>
          <input name="logoTagline" maxlength="120" />

          <label>Hero Announcement</label>
          <input name="heroAnnouncement" maxlength="120" />

          <label>Hero Description</label>
          <textarea name="heroDescription" rows="3" maxlength="260"></textarea>

          <label>Main Booking CTA</label>
          <input name="bookingCta" maxlength="80" />

          <label>Floating Button Text</label>
          <input name="floatingButtonText" maxlength="40" />
        </section>

        <section class="card">
          <h2>Pricing</h2>
          <label>Standard Court Price</label>
          <input name="standardCourtPrice" maxlength="12" />

          <label>Single Court Price</label>
          <input name="singleCourtPrice" maxlength="12" />

          <label>Table Price</label>
          <input name="tablePrice" maxlength="20" />

          <label>Court Membership</label>
          <input name="courtMembershipPrice" maxlength="12" />

          <label>All Access Membership</label>
          <input name="allAccessMembershipPrice" maxlength="12" />
        </section>

        <section class="card">
          <h2>Contact</h2>
          <label>Location</label>
          <input name="contactLocation" maxlength="140" />

          <label>Phone</label>
          <input name="contactPhone" maxlength="40" />

          <label>Email</label>
          <input name="contactEmail" maxlength="80" />

          <label>Hours</label>
          <input name="contactHours" maxlength="120" />
        </section>
      </form>

      <section class="card bookings-card">
        <div class="bookings-head">
          <h2>Recent Bookings</h2>
          <button id="refreshBookingsBtn" class="btn" type="button">
            Refresh
          </button>
        </div>

        <div class="bookings-filters">
          <label>
            Date
            <input id="bookingsDateFilter" type="date" />
          </label>
          <label>
            Status
            <select id="bookingsStatusFilter">
              <option value="">All</option>
              <option value="pending">Pending</option>
              <option value="paid">Paid</option>
              <option value="expired">Expired</option>
              <option value="failed">Failed</option>
            </select>
          </label>
          <label>
            Email
            <input
              id="bookingsEmailFilter"
              type="text"
              placeholder="Search email"
            />
          </label>
        </div>

        <div class="bookings-table-wrap">
          <table class="bookings-table">
            <thead>
              <tr>
                <th>Created</th>
                <th>Customer</th>
                <th>Facility</th>
                <th>Date</th>
                <th>Time</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody">
              <tr>
                <td colspan="7">Loading bookings...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <footer class="actions">
        <button id="saveBtn" class="btn primary" type="button">
          Save Changes
        </button>
        <button id="resetBtn" class="btn" type="button">
          Reset to Defaults
        </button>
        <span id="statusText" class="status"></span>
      </footer>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
