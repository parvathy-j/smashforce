<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smashforce Badminton Centre Admin Panel</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpeg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-wrap">
      <header class="admin-head">
        <div>
          <p class="eyebrow">Smashforce Badminton Centre</p>
          <h1>Website Admin Panel</h1>
          <p class="sub"></p>
        </div>
        <div class="quick-links">
          <span id="adminSessionLabel">Checking session…</span>
          <button id="adminLogoutBtn" type="button">Logout</button>
          <a href="smash-force-academy.html" target="_blank">Open Website</a>
          <a href="booking.html" target="_blank">Open Booking</a>
          <a href="receptionist.html" target="_blank">Receptionist Dashboard</a>
        </div>
      </header>

      <!-- Branding, Pricing, and Contact sections removed as per client request -->

      <section class="card bookings-card">
        <div class="bookings-head">
          <h2>Recent Bookings</h2>
          <button id="refreshBookingsBtn" class="btn" type="button">
            Refresh
          </button>
          <button
            id="reconcileBookingsBtn"
            class="btn"
            type="button"
            style="margin-left: 1em"
          >
            Reconcile
          </button>
        </div>

        <div class="bookings-filters">
          <label>
            Date
            <input id="bookingsDateFilter" type="date" />
          </label>
          <label>
            Status
            <select id="bookingsStatusFilter">
              <option value="">All</option>
              <option value="pending">Pending</option>
              <option value="pending_in_person">Pending In Person</option>
              <option value="paid">Paid</option>
              <option value="expired">Expired</option>
              <option value="failed">Failed</option>
            </select>
          </label>
          <label>
            Email
            <input
              id="bookingsEmailFilter"
              type="text"
              placeholder="Search email"
            />
          </label>
        </div>

        <!-- Booked Courts/Tables Summary -->
        <div id="bookedSummary" class="summary-box booked-summary">
          <strong>Booked Courts/Tables for selected date:</strong>
          <div id="bookedSummaryContent" style="margin-top: 0.5em"></div>
        </div>

        <div class="bookings-table-wrap">
          <table class="bookings-table">
            <thead>
              <tr>
                <th>Created</th>
                <th>Reference</th>
                <th>Customer</th>
                <th>Facility</th>
                <th>Date</th>
                <th>Time</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody">
              <tr>
                <td colspan="8">Loading bookings...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="bookings-filters">
          <label style="display: flex; align-items: center; gap: 0.5em">
            Reference
            <input
              id="bookingsRefFilter"
              type="text"
              placeholder="Search ref"
              style="flex: 1"
            />
            <button
              id="bookingsRefSearchBtn"
              type="button"
              class="btn"
              style="margin-left: 0.5em"
            >
              Search
            </button>
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Membership Lookup</h2>
        <form
          id="membershipLookupForm"
          style="
            display: flex;
            gap: 1em;
            align-items: flex-end;
            flex-wrap: wrap;
          "
        >
          <label>
            Email
            <input
              id="membershipLookupEmail"
              type="email"
              placeholder="Enter customer email"
              required
              style="min-width: 220px"
            />
          </label>
          <button type="submit" class="btn">Check Membership</button>
        </form>
        <div
          id="membershipLookupResult"
          style="margin-top: 0.5em; font-weight: 500"
        ></div>
      </section>

      <footer class="actions">
        <button id="saveBtn" class="btn primary" type="button">
          Save Changes
        </button>
        <button id="resetBtn" class="btn" type="button">
          Reset to Defaults
        </button>
        <span id="statusText" class="status"></span>
      </footer>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
