<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smashforce Admin Panel</title>

    <link rel="icon" href="favicon.jpeg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
  </head>

  <body>
    <main class="admin-wrap">
      <!-- HEADER -->
      <header class="admin-head">
        <div>
          <p class="eyebrow">Smashforce Badminton Centre</p>
          <h1>Admin Dashboard</h1>
        </div>

        <div class="quick-links">
          <span id="adminSessionLabel">Checking session…</span>
          <button id="adminLogoutBtn">Logout</button>
          <a href="booking.html" target="_blank">Bookings</a>
          <a href="receptionist.html" target="_blank">Reception</a>
        </div>
      </header>

      <!-- CALENDAR -->
      <section class="card">
        <h2>📅 Calendar</h2>
        <div id="adminCalendarContainer"></div>

        <div class="table-container">
          <table id="adminCalendarBookingsTable">
            <thead>
              <tr>
                <th>Time</th>
                <th>Facility</th>
                <th>Court/Table</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- BOOKINGS -->
      <section class="card">
        <div class="section-head">
          <h2>📋 Recent Bookings</h2>
          <div>
            <button id="refreshBookingsBtn" class="btn">Refresh</button>
            <button id="reconcileBookingsBtn" class="btn">Reconcile</button>
          </div>
        </div>

        <!-- FILTERS -->
        <div class="filters">
          <input id="bookingsDateFilter" type="date" />
          <select id="bookingsStatusFilter">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="pending_in_person">Pending In Person</option>
            <option value="paid">Paid</option>
            <option value="expired">Expired</option>
            <option value="failed">Failed</option>
          </select>
          <input id="bookingsEmailFilter" placeholder="Search email" />
        </div>

        <!-- SUMMARY -->
        <div id="bookedSummary" class="summary-box">
          <strong>Booked Courts:</strong>
          <div id="bookedSummaryContent"></div>
        </div>

        <!-- TABLE -->
        <div class="table-container">
          <table class="bookings-table">
            <thead>
              <tr>
                <th>Created</th>
                <th>Ref</th>
                <th>Customer</th>
                <th>Facility</th>
                <th>Date</th>
                <th>Time</th>
                <th>Amount</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody">
              <tr>
                <td colspan="9">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- SEARCH -->
        <div class="filters">
          <input id="bookingsRefFilter" placeholder="Search reference" />
          <button id="bookingsRefSearchBtn" class="btn">Search</button>
        </div>
      </section>

      <!-- MEMBERSHIP -->
      <section class="card">
        <h2>👤 Membership Lookup</h2>

        <form id="membershipLookupForm" class="inline-form">
          <input
            id="membershipLookupEmail"
            type="email"
            placeholder="Enter email"
            required
          />
          <button class="btn">Check</button>
        </form>

        <div id="membershipLookupResult"></div>
      </section>

      <!-- ACTIONS -->
      <footer class="actions">
        <button id="saveBtn" class="btn primary">Save Changes</button>
        <button id="resetBtn" class="btn">Reset</button>
        <span id="statusText"></span>
      </footer>
    </main>

    <script src="admin.js"></script>

    <script>
      const MONTHS = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      let adminCalDate = new Date();

      function renderAdminCalendar() {
        const container = document.getElementById("adminCalendarContainer");
        const year = adminCalDate.getFullYear();
        const month = adminCalDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        let html = `
    <div class="calendar-header">
      <button onclick="adminChangeMonth(-1)">‹</button>
      <span>${MONTHS[month]} ${year}</span>
      <button onclick="adminChangeMonth(1)">›</button>
    </div>
    <div class="calendar-grid">
  `;

        ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach((d) => {
          html += `<div class="day-label">${d}</div>`;
        });

        let day = 1;
        for (let i = 0; i < 42; i++) {
          if (i < firstDay || day > daysInMonth) {
            html += `<div></div>`;
          } else {
            html += `<div class="day" onclick="adminSelectCalDate(${year},${month},${day},this)">${day}</div>`;
            day++;
          }
        }

        html += "</div>";
        container.innerHTML = html;
      }

      function adminChangeMonth(dir) {
        adminCalDate.setMonth(adminCalDate.getMonth() + dir);
        renderAdminCalendar();
      }

      function adminSelectCalDate(y, m, d, el) {
        document
          .querySelectorAll(".day")
          .forEach((e) => e.classList.remove("selected"));
        el.classList.add("selected");

        const dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        loadAdminCalendarBookings(dateStr);
      }

      async function loadAdminCalendarBookings(dateStr) {
        const tbody = document.querySelector(
          "#adminCalendarBookingsTable tbody",
        );
        tbody.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';

        try {
          const res = await fetch(
            `/api/bookings?date=${encodeURIComponent(dateStr)}`,
          );
          const bookings = await res.json();

          if (!bookings.length) {
            tbody.innerHTML = '<tr><td colspan="6">No bookings</td></tr>';
            return;
          }

          tbody.innerHTML = bookings
            .map(
              (b) => `
      <tr>
        <td>${b.time || ""}</td>
        <td>${b.facility || ""}</td>
        <td>${b.court || ""}</td>
        <td>${b.name || ""}</td>
        <td>${b.email || ""}</td>
        <td>${b.phone || ""}</td>
      </tr>
    `,
            )
            .join("");
        } catch (err) {
          tbody.innerHTML = `<tr><td colspan="6">${err.message}</td></tr>`;
        }
      }

      renderAdminCalendar();
    </script>
  </body>
</html>
