<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smashforce — Reception</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpeg" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
    <style>
      .recep-wrap { width: min(680px, 92vw); margin: 34px auto; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .form-grid .full { grid-column: 1 / -1; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label { font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.5px; text-transform: uppercase; }
      .field input, .field select { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 10px 12px; font-family: "Outfit", sans-serif; font-size: 0.95rem; }
      .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
      .field select option { background: var(--bg-soft); }
      .price-display { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; font-size: 1.1rem; font-weight: 700; color: var(--accent); text-align: center; }
      .success-box { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.4); border-radius: 12px; padding: 1.2em 1.5em; color: #86efac; font-size: 0.95rem; display: none; }
      .error-box { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); border-radius: 12px; padding: 1em 1.4em; color: #fca5a5; font-size: 0.9rem; display: none; }
      .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 4px; }
      .slot-btn { padding: 8px 4px; text-align: center; border: 1.5px solid var(--line); border-radius: 7px; font-size: 0.78rem; font-weight: 600; cursor: pointer; background: transparent; color: var(--text); transition: 0.15s; }
      .slot-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      .slot-btn.selected { background: var(--accent); border-color: var(--accent); color: #041724; }
      .slot-btn.taken { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }
      .slot-btn.sel-mid { opacity: 0.85; }
      .slots-hint { font-size: 0.72rem; color: var(--text-dim); margin-top: 6px; }
      .slots-hint.warn { color: #f59e0b; }
      .sess-label { font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim); font-weight: 700; margin: 14px 0 8px; }
    </style>
  </head>
  <body>
    <main class="recep-wrap">
      <header class="admin-head">
        <div>
          <p class="eyebrow">Smashforce Badminton Centre</p>
          <h1>Walk-in / EFTPOS Booking</h1>
        </div>
        <div class="quick-links">
          <span id="sessionLabel">Checking session…</span>
          <a href="admin.html">Admin Panel</a>
          <button id="logoutBtn">Logout</button>
        </div>
      </header>

      <section class="card">
        <h2 style="margin-bottom:16px;">New Walk-in Booking</h2>

        <div id="successBox" class="success-box"></div>
        <div id="errorBox" class="error-box"></div>

        <form id="eftposForm" autocomplete="off">
          <div class="form-grid">

            <!-- Facility -->
            <div class="field">
              <label>Facility</label>
              <select id="r-facility" required>
                <option value="">— Select —</option>
                <option value="standard">Standard Courts (1–6) — $25/hr</option>
                <option value="single">Single Courts (7–9) — $15/hr</option>
                <option value="table">Multi-Game Tables — $15/hr</option>
              </select>
            </div>

            <!-- Court -->
            <div class="field">
              <label>Court / Table</label>
              <select id="r-court" required>
                <option value="">— Select facility first —</option>
              </select>
            </div>

            <!-- Date -->
            <div class="field">
              <label>Date</label>
              <input type="date" id="r-date" required />
            </div>

            <!-- Price display -->
            <div class="field">
              <label>Amount</label>
              <div class="price-display" id="r-price">$0.00</div>
            </div>

            <!-- Time slots -->
            <div class="field full">
              <label>Time Slots <span style="font-size:0.7rem;letter-spacing:0;">(min 1 hr = 2 slots)</span></label>
              <div id="r-slots-container"><p style="color:var(--text-dim);font-size:0.85rem;">Select a facility, court and date first.</p></div>
              <div id="r-slots-hint" class="slots-hint"></div>
            </div>

            <!-- Customer name -->
            <div class="field">
              <label>Customer Name</label>
              <input type="text" id="r-name" placeholder="Full name" required />
            </div>

            <!-- Phone -->
            <div class="field">
              <label>Phone</label>
              <input type="tel" id="r-phone" placeholder="04XX XXX XXX" pattern="^(\+?61|0)[2-578]\d{8}$" inputmode="tel" required />
            </div>

            <!-- Email -->
            <div class="field full">
              <label>Email <span style="font-size:0.7rem;letter-spacing:0;">(optional — sends confirmation)</span></label>
              <input type="email" id="r-email" placeholder="customer@email.com" />
            </div>

          </div>

          <div class="actions" style="margin-top:20px;">
            <button type="submit" class="btn primary" id="r-submit">Confirm EFTPOS Payment & Book</button>
            <button type="button" class="btn" id="r-reset">Clear</button>
          </div>
        </form>
      </section>
    </main>

    <script>
      const FACILITIES = {
        standard: { label: "Standard Courts (1–6)", price: 25, courts: [1,2,3,4,5,6] },
        single:   { label: "Single Courts (7–9)",   price: 15, courts: [7,8,9] },
        table:    { label: "Multi-Game Tables",      price: 15, courts: ["Table 1","Table 2","Table 3","Table 4","Table 5"] },
      };

      const ALL_SLOTS = [
        "6:00 AM","6:30 AM","7:00 AM","7:30 AM","8:00 AM","8:30 AM",
        "9:00 AM","9:30 AM","10:00 AM","10:30 AM","11:00 AM","11:30 AM",
        "12:00 PM","12:30 PM","1:00 PM","1:30 PM","2:00 PM","2:30 PM",
        "3:00 PM","3:30 PM","4:00 PM","4:30 PM","5:00 PM","5:30 PM",
        "6:00 PM","6:30 PM","7:00 PM","7:30 PM","8:00 PM","8:30 PM",
        "9:00 PM","9:30 PM","10:00 PM","10:30 PM",
      ];

      let selectedSlots = [];
      let bookedSlots = [];

      function slotToMins(t) {
        const m = String(t).trim().match(/^(\d+):(\d+)\s*(AM|PM)$/i);
        if (!m) return null;
        let h = parseInt(m[1]); const min = parseInt(m[2]); const ap = m[3].toUpperCase();
        if (ap === "PM" && h !== 12) h += 12;
        if (ap === "AM" && h === 12) h = 0;
        return h * 60 + min;
      }

      function addMins(t, mins) {
        let total = slotToMins(t) + mins;
        let h = Math.floor(total / 60), m = total % 60;
        const ap = h >= 12 ? "PM" : "AM";
        if (h > 12) h -= 12; if (h === 0) h = 12;
        return `${h}:${String(m).padStart(2,"0")} ${ap}`;
      }

      function getCourtNum(facility, courtVal) {
        if (facility === "table") return String(courtVal).replace(/^Table\s*/i, "");
        return String(courtVal);
      }

      async function fetchBooked() {
        const facility = document.getElementById("r-facility").value;
        const courtVal = document.getElementById("r-court").value;
        const date     = document.getElementById("r-date").value;
        if (!facility || !courtVal || !date) { bookedSlots = []; return; }
        try {
          const courtNum = getCourtNum(facility, courtVal);
          const res = await fetch(`/api/booked-slots?facility=${encodeURIComponent(facility)}&court=${encodeURIComponent(courtNum)}&date=${encodeURIComponent(date)}`);
          const data = res.ok ? await res.json() : { booked: [] };
          bookedSlots = Array.isArray(data.booked) ? data.booked : [];
        } catch { bookedSlots = []; }
      }

      function renderSlots() {
        const container = document.getElementById("r-slots-container");
        const facility  = document.getElementById("r-facility").value;
        const courtVal  = document.getElementById("r-court").value;
        const date      = document.getElementById("r-date").value;

        if (!facility || !courtVal || !date) {
          container.innerHTML = '<p style="color:var(--text-dim);font-size:0.85rem;">Select a facility, court and date first.</p>';
          updateHint(); updatePrice(); return;
        }

        const now = new Date();
        const isToday = date === `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
        const nowMins = now.getHours() * 60 + now.getMinutes();

        const morning = ALL_SLOTS.filter(s => slotToMins(s) < 12*60);
        const afternoon = ALL_SLOTS.filter(s => slotToMins(s) >= 12*60);

        function group(label, slots) {
          let h = `<div class="sess-label">${label}</div><div class="slots-grid">`;
          slots.forEach(t => {
            const taken  = bookedSlots.includes(t);
            const past   = isToday && slotToMins(t) < nowMins;
            const sel    = selectedSlots.includes(t);
            const isFirst = t === selectedSlots[0];
            const isLast  = t === selectedSlots[selectedSlots.length - 1];
            let cls = "slot-btn";
            if (taken || past) cls += " taken";
            if (sel) cls += " selected";
            if (sel && !isFirst && !isLast) cls += " sel-mid";
            const disabled = taken || past ? "disabled" : "";
            h += `<button type="button" class="${cls}" ${disabled} onclick="toggleSlot('${t}')">${t}</button>`;
          });
          return h + "</div>";
        }

        container.innerHTML = group("Morning / Afternoon", morning) + group("Evening", afternoon);
        updateHint();
        updatePrice();
      }

      function toggleSlot(time) {
        const now = new Date();
        const date = document.getElementById("r-date").value;
        const isToday = date === `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
        const nowMins = now.getHours() * 60 + now.getMinutes();

        if (selectedSlots.length === 0) {
          selectedSlots = [time];
        } else {
          const firstIdx = ALL_SLOTS.indexOf(selectedSlots[0]);
          const lastIdx  = ALL_SLOTS.indexOf(selectedSlots[selectedSlots.length - 1]);
          const clickIdx = ALL_SLOTS.indexOf(time);

          if (clickIdx === firstIdx && clickIdx === lastIdx) {
            selectedSlots = [];
          } else if (clickIdx === lastIdx) {
            selectedSlots = selectedSlots.slice(0, -1);
          } else if (clickIdx === firstIdx) {
            selectedSlots = selectedSlots.slice(1);
          } else if (clickIdx > firstIdx && clickIdx < lastIdx) {
            selectedSlots = ALL_SLOTS.slice(firstIdx, clickIdx + 1);
          } else if (clickIdx > lastIdx) {
            let ok = true;
            for (let i = lastIdx + 1; i <= clickIdx; i++) {
              const t = ALL_SLOTS[i], prev = ALL_SLOTS[i-1];
              if (slotToMins(t) - slotToMins(prev) !== 30) { ok = false; break; }
              if (bookedSlots.includes(t) || (isToday && slotToMins(t) < nowMins)) { ok = false; break; }
            }
            selectedSlots = ok ? ALL_SLOTS.slice(firstIdx, clickIdx + 1) : [time];
          } else {
            selectedSlots = [time];
          }
        }
        renderSlots();
      }

      function updateHint() {
        const hint = document.getElementById("r-slots-hint");
        const n = selectedSlots.length;
        if (n === 0) { hint.textContent = "Select slots — minimum 1 hour (2 slots)"; hint.className = "slots-hint"; }
        else if (n === 1) { hint.textContent = "Select 1 more slot to reach the 1-hour minimum"; hint.className = "slots-hint warn"; }
        else { hint.textContent = `${n} slots · ${(n*0.5).toFixed(1).replace(".0","")} hr${n*0.5!==1?"s":""} selected`; hint.className = "slots-hint"; }
      }

      function updatePrice() {
        const facility = document.getElementById("r-facility").value;
        const fac = FACILITIES[facility];
        const n = selectedSlots.length;
        const price = fac ? fac.price * n * 0.5 : 0;
        document.getElementById("r-price").textContent = `$${price.toFixed(2)}`;
      }

      // Court picker
      document.getElementById("r-facility").addEventListener("change", function() {
        const fac = FACILITIES[this.value];
        const courtSel = document.getElementById("r-court");
        courtSel.innerHTML = '<option value="">— Select —</option>';
        if (fac) {
          fac.courts.forEach(c => {
            const label = typeof c === "number" ? `Court ${c}` : c;
            const opt = document.createElement("option");
            opt.value = label; opt.textContent = label;
            courtSel.appendChild(opt);
          });
        }
        selectedSlots = [];
        refreshAndRender();
      });

      document.getElementById("r-court").addEventListener("change", refreshAndRender);
      document.getElementById("r-date").addEventListener("change", function() { selectedSlots = []; refreshAndRender(); });

      async function refreshAndRender() {
        await fetchBooked();
        renderSlots();
      }

      // Set default date to today
      (function() {
        const today = new Date();
        document.getElementById("r-date").value =
          `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
      })();

      // Form submit
      document.getElementById("eftposForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const btn = document.getElementById("r-submit");
        const errBox = document.getElementById("errorBox");
        const okBox  = document.getElementById("successBox");
        errBox.style.display = "none";
        okBox.style.display  = "none";

        const facility = document.getElementById("r-facility").value;
        const courtVal = document.getElementById("r-court").value;
        const date     = document.getElementById("r-date").value;
        const name     = document.getElementById("r-name").value.trim();
        const phone    = document.getElementById("r-phone").value.trim();
        const email    = document.getElementById("r-email").value.trim();

        if (!facility || !courtVal || !date) { errBox.textContent = "Please select facility, court and date."; errBox.style.display = "block"; return; }
        if (selectedSlots.length < 2) { errBox.textContent = "Please select at least 2 slots (1 hour minimum)."; errBox.style.display = "block"; return; }
        if (!name) { errBox.textContent = "Please enter the customer's name."; errBox.style.display = "block"; return; }
        if (!/^(\+?61|0)[2-578]\d{8}$/.test(phone.replace(/\s/g,""))) { errBox.textContent = "Please enter a valid Australian phone number."; errBox.style.display = "block"; return; }

        const startTime = selectedSlots[0];
        const endTime   = addMins(selectedSlots[selectedSlots.length - 1], 30);
        const time      = `${startTime} - ${endTime}`;
        const fac       = FACILITIES[facility];
        const hrs       = selectedSlots.length * 0.5;
        const amount    = Math.round(fac.price * hrs * 100); // cents

        btn.disabled = true;
        btn.textContent = "Saving…";

        try {
          const res = await fetch("/create-eftpos-booking", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ facility, court: courtVal, date, time, duration: `${hrs} hr${hrs!==1?"s":""}`, name, phone, email, amount }),
          });
          const data = await res.json();
          if (!res.ok) { throw new Error(data.error || "Booking failed."); }

          okBox.innerHTML = `<strong>Booking confirmed!</strong> Ref: <strong>${data.ref}</strong><br>
            ${name} · ${courtVal} · ${date} · ${time}${email ? `<br>Confirmation email sent to ${email}` : ""}`;
          okBox.style.display = "block";

          // Reset form
          selectedSlots = [];
          document.getElementById("eftposForm").reset();
          const today = new Date();
          document.getElementById("r-date").value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
          document.getElementById("r-slots-container").innerHTML = '<p style="color:var(--text-dim);font-size:0.85rem;">Select a facility, court and date first.</p>';
          document.getElementById("r-price").textContent = "$0.00";
          document.getElementById("r-slots-hint").textContent = "";
        } catch(err) {
          errBox.textContent = err.message || "Could not save booking. Please try again.";
          errBox.style.display = "block";
        } finally {
          btn.disabled = false;
          btn.textContent = "Confirm EFTPOS Payment & Book";
        }
      });

      document.getElementById("r-reset").addEventListener("click", function() {
        selectedSlots = [];
        document.getElementById("eftposForm").reset();
        const today = new Date();
        document.getElementById("r-date").value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
        document.getElementById("r-slots-container").innerHTML = '<p style="color:var(--text-dim);font-size:0.85rem;">Select a facility, court and date first.</p>';
        document.getElementById("r-price").textContent = "$0.00";
        document.getElementById("r-slots-hint").textContent = "";
        document.getElementById("errorBox").style.display = "none";
        document.getElementById("successBox").style.display = "none";
      });

      document.getElementById("logoutBtn").addEventListener("click", async function() {
        await fetch("/logout", { method: "POST" });
        window.location.href = "smash-force-academy.html";
      });

      // Auth check
      (async function() {
        try {
          const res = await fetch("/me");
          if (!res.ok) { window.location.href = "smash-force-academy.html"; return; }
          const data = await res.json();
          if (!data.user?.isAdmin) { window.location.href = "smash-force-academy.html"; return; }
          document.getElementById("sessionLabel").textContent = `Signed in as ${data.user.name || data.user.email}`;
        } catch { window.location.href = "smash-force-academy.html"; }
      })();
    </script>
  </body>
</html>
